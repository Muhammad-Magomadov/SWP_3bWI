<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;                    /* Entfernt den Standardabstand um die Seite. */
            overflow: hidden;             /* Verhindert Scrollleisten am Fensterrand. */
            height: 100vh;                /* Setzt die Seitenhöhe auf die volle Fensterhöhe. */
        }

        .katze {
            position: absolute;           /* Ermöglicht das freie Platzieren der Bilder. */
            width: 80px;                  /* Legt die Breite jedes Bildes fest. */
            height: 80px;                 /* Legt die Höhe jedes Bildes fest. */
        }
    </style>
</head>

<body>
    <script>
        const bewegungsrichtungen = [[1, 0], [-1, 0], [0, 1], [0, -1]];                    // Bewegungen nach rechts, links, unten und oben.

        function createImagekatze(index) {                    // Erstellt ein Katzenbild mit einer Nummer.
            const img = document.createElement("img");                    // Erzeugt ein neues Bild-Element.
            img.id = `katze-${index}`;                    // Gibt dem Bild eine eindeutige ID.
            img.src = 'media/katze_cute.png';                    // Legt die Bilddatei fest.
            img.className = "katze";                    // Weist dem Bild die CSS-Klasse zu.
            img.title = `Katze ${index}`;                    // Setzt einen Hinweistext beim Darüberfahren.

            const x = Math.random() * Math.max(0, window.innerWidth - 80);                    // Wählt eine zufällige X-Position.
            const y = Math.random() * Math.max(0, window.innerHeight - 80);                    // Wählt eine zufällige Y-Position.
            img.dataset.x = x;                    // Speichert die X-Position am Bild.
            img.dataset.y = y;                    // Speichert die Y-Position am Bild.
            const richtung = bewegungsrichtungen[Math.floor(Math.random() * bewegungsrichtungen.length)];                    // Wählt eine zufällige Startbewegung.
            img.dataset.dx = richtung[0];                    // Speichert die horizontale Bewegungsrichtung.
            img.dataset.dy = richtung[1];                    // Speichert die vertikale Bewegungsrichtung.
            img.style.left = `${x}px`;                    // Setzt die horizontale Bildposition.
            img.style.top = `${y}px`;                    // Setzt die vertikale Bildposition.
            return img;                    // Gibt das fertige Bild zurück.
        }

        for (let i = 0; i < 32; i++) {                    // Erstellt zehn Katzenbilder.
            document.body.appendChild(createImagekatze(i));                    // Fügt jedes Bild zur Webseite hinzu.
        }
    </script>

    <script>
        function animate() {                    // Führt einen Schritt der Katzenanimation aus.
            const katzen = document.querySelectorAll(".katze");                    // Sucht alle Katzenbilder auf der Seite.
            const max = { x: window.innerWidth - 80, y: window.innerHeight - 80 };                    // Berechnet die maximalen Positionen.

            for (const katze of katzen) {                    // Bewegt jedes Katzenbild.
                for (const achse of ["x", "y"]) {                    // Berechnet die Bewegung für X und Y.
                    let position = Number(katze.dataset[achse]) + Number(katze.dataset[`d${achse}`]) * 2;                    // Bewegt die Katze um zwei Pixel.
                    if (position <= 0 || position >= max[achse]) {                    // Prüft, ob die Katze einen Fensterrand erreicht.
                        katze.dataset[`d${achse}`] *= -1;                    // Dreht die Richtung am Rand um.
                        position = Math.max(0, Math.min(position, max[achse]));                    // Hält das Bild im Fenster.
                    }
                    katze.dataset[achse] = position;                    // Speichert die neue Position.
                }
            }

            for (let i = 0; i < katzen.length; i++) {                    // Wählt jedes Katzenbild als erstes Bild aus.
                for (let j = i + 1; j < katzen.length; j++) {                    // Vergleicht es mit jedem folgenden Bild.
                    const katzeA = katzen[i];                    // Speichert das erste Bild des Vergleichs.
                    const katzeB = katzen[j];                    // Speichert das zweite Bild des Vergleichs.
                    const abstandX = Number(katzeA.dataset.x) - Number(katzeB.dataset.x);                    // Berechnet den horizontalen Abstand.
                    const abstandY = Number(katzeA.dataset.y) - Number(katzeB.dataset.y);                    // Berechnet den vertikalen Abstand.
                    const beruehrtSich = Math.abs(abstandX) < 80 && Math.abs(abstandY) < 80;                    // Prüft, ob sich die Bilder überlappen.
                    const kollisionsName = `kollision${j}`;                    // Benennt den gespeicherten Kollisionsstatus.

                    if (beruehrtSich && katzeA.dataset[kollisionsName] !== "1") {                    // Reagiert nur beim Beginn einer Berührung.
                        if (Math.abs(abstandX) > Math.abs(abstandY)) {                    // Prüft, ob die Berührung eher seitlich ist.
                            katzeA.dataset.dx = abstandX < 0 ? -1 : 1;                    // Bewegt das erste Bild horizontal weg.
                            katzeB.dataset.dx = abstandX < 0 ? 1 : -1;                    // Bewegt das zweite Bild entgegengesetzt.
                        } else {                    // Wird verwendet, wenn die Berührung eher oben oder unten ist.
                            katzeA.dataset.dy = abstandY < 0 ? -1 : 1;                    // Bewegt das erste Bild vertikal weg.
                            katzeB.dataset.dy = abstandY < 0 ? 1 : -1;                    // Bewegt das zweite Bild entgegengesetzt.
                        }
                    }
                    katzeA.dataset[kollisionsName] = beruehrtSich ? "1" : "";                    // Merkt sich, ob die Bilder noch berührt sind.
                }
            }

            for (const katze of katzen) {                    // Aktualisiert die Darstellung aller Katzenbilder.
                katze.style.left = `${katze.dataset.x}px`;                    // Setzt die horizontale Position.
                katze.style.top = `${katze.dataset.y}px`;                    // Setzt die vertikale Position.
            }

            requestAnimationFrame(animate);                    // Plant den nächsten Animationsschritt ein.
        }

        animate();                    // Startet die Animation.
    </script>
</body>
</html>
