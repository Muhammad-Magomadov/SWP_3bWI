    <script>
        const elefant = document.getElementById('elefant');
        let position = 80; // Startposition (80% von links)
        let direction = -1; // Bewegungsrichtung (-1 = links, 1 = rechts)

        function animate() {
            for (let i = 0; i < ele_liste.length; i++) {
                elephant = document.getElementById(ele_liste[i][0]);
                // Aktualisiere die Position
                position += direction * 0.5; // Bewegungsgeschwindigkeit

                if (position <= 10) {
                    direction = 1; // Bewege nach rechts
                } else if (position >= 80) {
                    direction = -1; // Bewege nach links
                }

                // werte y
                ele_liste[i][5] = position;

                elefant.style.left = `${position}px`;
                elefant.style.top = `${position}px`;
            }
            // Führe die Animation erneut aus
            requestAnimationFrame(animate);
        }
