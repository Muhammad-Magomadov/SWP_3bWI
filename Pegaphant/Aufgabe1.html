<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #katze {
            position: absolute;
            width: 200px;
        }
    </style>
</head>

<body>
    <script>
        let katz_name = "Fran";
        let katz_farbe = "Schwarz";
        let katz_geschlecht = "W";
        let katz_position_x = 0;
        let katz_position_y = 1;
        let katz_hoehe = 280; //cm
        let katz_gewicht = 800; //kg
        let katz_alter = 30; //Jahre
        let katz_fluegellaenge = 300; // cm
        let katz_breite = 187; //cm
        let katz_geschwindigkeit = 9; //kmh
        let katz_istamfliegen = false;
        let katz_istamkaken = false;
        let katz_anzahl_fluegel = 2;

        const true_false = [true, false];
        const farbenliste = ["Violet", "Pink", "Blue", "Green", "Yellow", "Red", "Orange", "Purple", "Brown", "Black"];
        const namensliste = ["George", "Gustav", "Günther", "Gisela", "Gertrud", "Gottfried", "Greta", "Günter", "Gabriele", "Güntherina"];
        const geschlechtliste = ["M", "W"];
        const katz_arrayname = ["name", "farbe", "geschlecht", "position_x", "position_y", "hoehe", "gewicht", "alter", "fluegellaenge", "breite", "geschwindigkeit", "istamfliegen", "istamkaken", "anzahl_fluegel"];
        const katz_array = [katz_name, katz_farbe, katz_geschlecht, katz_position_x, katz_position_y, katz_hoehe, katz_gewicht, katz_alter, katz_fluegellaenge, katz_breite, katz_geschwindigkeit, katz_istamfliegen, katz_istamkaken, katz_anzahl_fluegel];
        const katz_liste = [];
        katz_liste.push(katz_array);

        function createImagePega(index, left, top) {
            const img = document.createElement("img");
            img.id = `katze-${index}`;
            img.src = 'media/katze_cute.png';
            img.className = "katze";
            img.title = `Katze ${index}`;
            img.width = 80;
            img.style.position = "absolute";
            img.style.left = left + "px";
            img.style.top = top + "px";
            return img;
        }

        function init_katz_liste(n) {
            for (let i = 0; i < n; i++) {
                let random_number = Math.floor(Math.random() * 100) + 1;
                let random_name = namensliste[Math.floor(Math.random() * namensliste.length)];
                let random_true_false = true_false[Math.floor(Math.random() * true_false.length)];
                let random_farbe = farbenliste[Math.floor(Math.random() * farbenliste.length)];
                let random_geschlecht = geschlechtliste[Math.floor(Math.random() * geschlechtliste.length)];
                let new_katz_array = [random_name, random_farbe, random_geschlecht, random_number, random_number, random_number, random_number, random_number, random_number, random_number, random_number, random_true_false, random_true_false, 2];
                katz_liste.push(new_katz_array);
                document.body.appendChild(createImagePega(i, i * 100, i * 30));
            }
        }

        function print_array(katz) {
            for (let i = 0; i < katz.length; i++) {
                console.log(katz_arrayname[i] + " : " + katz[i]);
            }
        }

        function print_arrayliste(katzliste) {
            for (let i = 0; i < katzliste.length; i++) {
                console.log("Katze " + (i + 1) + ":");
                print_array(katzliste[i]);
            }
        }

        init_katz_liste(10);
        print_array(katz_array);
        print_arrayliste(katz_liste);
    </script>

    <script>
        const katzenBilder = [];

        function animate() {
            for (let i = 0; i < katz_liste.length; i++) {
                const katzenbild = document.getElementById(`katze-${i}`);
                if (!katzenbild) continue;

                let position = Number(katzenbild.dataset.position || 0);
                let direction = Number(katzenbild.dataset.direction || 1);

                position += direction * 0.3;

                if (position <= 10) {
                    direction = 1;
                } else if (position >= 80) {
                    direction = -1;
                }

                position = Math.min(Math.max(position, 10), 80);
                katzenbild.dataset.position = position;
                katzenbild.dataset.direction = direction;
                katzenbild.style.left = `${position}%`;
                katzenbild.style.top = `${(i + 1) * 12}%`;

                katz_liste[i][4] = position;
                katz_liste[i][5] = (i + 1) * 12;
            }

            requestAnimationFrame(animate);
        }

        for (let i = 0; i < katz_liste.length; i++) {
            const bild = document.getElementById(`katze-${i}`);
            if (bild) {
                bild.dataset.position = i * 8;
                bild.dataset.direction = i % 2 === 0 ? 1 : -1;
            }
        }

        animate();
    </script>
</body>

</html>
